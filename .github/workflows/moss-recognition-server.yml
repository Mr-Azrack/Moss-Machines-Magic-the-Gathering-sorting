name: MOSS Recognition Server

on:
  push:
    paths:
      - "server/moss_recognition/**"
      - ".github/workflows/moss-recognition-server.yml"
  pull_request:
    paths:
      - "server/moss_recognition/**"
      - ".github/workflows/moss-recognition-server.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal server dependencies
        run: python -m pip install -r server/moss_recognition/requirements.txt
      - name: Test recognition review and API safety
        run: python -Werror -m unittest discover -s server/moss_recognition/tests -v
