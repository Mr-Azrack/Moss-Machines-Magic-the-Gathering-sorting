name: MOSS loading park

on:
  pull_request:
    paths:
      - "Current version/Main/Main.ino"
      - "Current version/gui_interface_enhanced.py"
      - "Current version/optimized_scanner.py"
      - "Current version/tests/test_loading_park_gui.py"
      - "Current version/tests/test_endstop_park_firmware.py"
      - "Current version/tests/test_serial_motion_protocol.py"
      - "Current version/tests/test_stopped_autoscan_safety.py"
      - "Current version/tests/test_start_without_homing.py"
      - "Current version/error_codes.py"
      - ".github/workflows/moss-loading-park.yml"
  push:
    branches:
      - "feature/card-loading-park-*"
      - "fix/moss-park-endstops-*"
      - "fix/moss-auto-scan-paused-*"
      - "fix/moss-start-no-auto-home-*"

jobs:
  gui-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile UI and error-code modules
        run: |
          python -m py_compile "Current version/gui_interface_enhanced.py" "Current version/optimized_scanner.py" "Current version/error_codes.py"
      - name: Verify loading-state GUI interlocks
        run: python -m unittest discover -s "Current version/tests" -p "test_loading_park_gui.py" -v
      - name: Verify full-height card release path
        run: python -m unittest discover -s "Current version/tests" -p "test_full_height_drop.py" -v
      - name: Endstop park must not run pickup/sort routines
        run: python -m unittest discover -s "Current version/tests" -p "test_endstop_park_firmware.py" -v
      - name: Serial protocol and timeout regression
        run: python -m unittest discover -s "Current version/tests" -p "test_serial_motion_protocol.py" -v
      - name: Stopped machine auto-scan and endstop regression
        run: python -m unittest discover -s "Current version/tests" -p "test_stopped_autoscan_safety.py" -v
      - name: START never homes or lowers Z
        run: python -m unittest discover -s "Current version/tests" -p "test_start_without_homing.py" -v
  firmware-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install Arduino Mega toolchain
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
      - name: Install firmware libraries
        run: |
          arduino-cli lib install "LiquidCrystal I2C"
          arduino-cli lib install "Adafruit_VL6180X"
          arduino-cli lib install "Stepper"
      - name: Compile Arduino Mega firmware
        run: arduino-cli compile --fqbn arduino:avr:mega "Current version/Main"
